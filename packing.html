<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#13866e">
    <title>荷物チェック | わが家の記録帳</title>
      <link rel="stylesheet" href="css/mock.css">
    </head>
    <body>
      <div class="app">
        <header class="top">
          <div class="topline">
            <a class="back" href="family.html">‹</a>
              <h1>荷物チェック</h1>
              </div>
              <div class="sub">わが家の記録帳 ・ 家族の共有スペース</div>
              </header>
              <main class="content">
                <section class="card">
                  <h2>持ち物チェック</h2>
                    <div class="muted">テンプレートを選んで、必要に応じて自由に編集できます。</div>
                      <select id="template" class="field" style="margin:12px 0">
                        <option value="daytrip">日帰りお出かけ</option>
                          <option value="overnight">宿泊旅行</option>
                            <option value="pool">プール・水遊び</option>
                              <option value="custom">自由編集リスト</option>
                              </select>
                              <div class="progressrow">
                                <div class="progress">
                                  <span id="bar" style="width:0">
                                  </span>
                                </div>
                                <small id="progress">0 / 0 準備OK</small>
                                </div>
                                <div id="items">
                                </div>
                                <form id="addForm" class="formrow">
                                  <input id="newItem" class="field" placeholder="持ち物を追加" required>
                                  <button class="btn">追加</button>
                                  </form>
                                  <div class="btnrow">
                                    <button class="btn secondary" id="reset" type="button">↻ チェックをリセット</button>
                                    </div>
                                  </section>
                                </main>
                                <nav class="bottom">
                                  <a href="home.html">
                                    <span>⌂</span>ホーム</a>
                                      <a href="calendar.html">
                                        <span>▦</span>カレンダー</a>
                                          <a class="active" href="family.html">
                                            <span>♧</span>家族</a>
                                              <a href="pet.html">
                                                <span>🐾</span>ペット</a>
                                                </nav>
                                              </div>
                                              <div id="toast" class="toast">
                                              </div>
                                              <script src="js/mock.js">
                                              </script>
                                              <script src="js/packing.js">
                                              </script>
                                            </body>
                                          </html>
