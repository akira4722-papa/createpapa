<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#f5f5f3"><title>荷物チェック | わが家の記録帳</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/family-pages.css"></head><body>
<aside class="sidebar"><div class="logo">🏠 わが家の記録帳<small>Family Dashboard</small></div><button class="nav-item" onclick="location.href='home.html'">🏠 ホーム</button><button class="nav-item" onclick="location.href='calendar.html'">📅 カレンダー</button><button class="nav-item" onclick="location.href='family.html'">👨‍👩‍👧‍👧 家族</button><button class="nav-item" onclick="location.href='pet.html'">🐈 ペット</button><button class="nav-item">☰ その他</button></aside><main class="main"><header class="header"><div><div class="date" id="todayDate"></div><div class="header-title">荷物チェック</div></div><div class="family-header-chip"><span>👨‍👩‍👧‍👧</span><span>家族の共有スペース</span></div></header><main class="family-content">
<section class="family-page-heading"><a class="family-back" href="family.html">‹ 家族に戻る</a><h1>荷物チェック</h1><p>持ち物を確認して、忘れ物を減らそう。</p></section>
<section class="family-panel"><div class="family-panel-heading"><div><h2>準備の進み具合</h2><p id="progress">0 / 0 準備OK</p></div><button class="family-button secondary" id="reset" type="button">チェックをリセット</button></div><div class="family-progress"><div id="bar"></div></div><div class="family-form family-packing-controls"><select id="template" class="family-input" aria-label="テンプレートカテゴリ"></select><input id="newItem" class="family-input" placeholder="チェックリストに持ち物を追加" maxlength="120"><button class="family-button" id="addItem" type="button">＋ 追加</button></div><form id="addForm" class="family-hidden-form"><button type="submit" hidden></button></form><div id="items" class="family-list" aria-live="polite"></div><div class="family-divider"></div><div class="family-panel-heading"><div><h2>カテゴリ設定</h2><p>テンプレートカテゴリを管理できます。</p></div><button class="family-button secondary" id="openCategoryModal" type="button">カテゴリを登録</button></div><div class="family-divider"></div><div class="family-panel-heading"><div><h2 id="templateItemsHeading">テンプレートの持ち物</h2><p>選択中カテゴリに紐づく、次回も使える持ち物リストです。</p></div></div><form id="templateItemForm" class="family-form"><input id="newTemplateItem" class="family-input" maxlength="120" placeholder="例：水筒" aria-label="テンプレートの持ち物" required><button class="family-button secondary" type="submit">＋ テンプレートに追加</button></form><div id="templateItems" class="family-list" aria-live="polite"></div></section></main></main>
<nav class="mobile-nav"><button class="mobile-nav-item" onclick="location.href='home.html'"><span>🏠</span>ホーム</button><button class="mobile-nav-item" onclick="location.href='calendar.html'"><span>📅</span>予定</button><button class="mobile-nav-item active" onclick="location.href='family.html'"><span>👨‍👩‍👧‍👧</span>家族</button><button class="mobile-nav-item" onclick="location.href='pet.html'"><span>🐈</span>ペット</button><button class="mobile-nav-item"><span>☰</span>その他</button></nav><div id="toast" class="family-toast" role="status" aria-live="polite"></div><div id="categoryModal" class="family-modal-backdrop" hidden role="presentation"><section class="family-modal" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle"><div class="family-modal-heading"><div><h2 id="categoryModalTitle">荷物カテゴリの登録</h2><p>登録したカテゴリはテンプレート選択肢に反映されます。</p></div><button type="button" class="family-modal-close" data-close-category-modal aria-label="閉じる">×</button></div><form id="categoryForm" class="family-form"><input id="newCategory" class="family-input" maxlength="40" placeholder="例：公園、帰省、習い事" aria-label="新しい荷物カテゴリ" required><button class="family-button" type="submit">＋ 登録</button></form><h3 class="family-modal-subtitle">登録済みカテゴリ</h3><div id="categoryList" class="family-list" aria-live="polite"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/family-db.js"></script><script src="js/family-packing.js"></script><script>document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());</script></body></html>
