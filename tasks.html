<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#13866e">
    <title>家族タスク | わが家の記録帳</title>
      <link rel="stylesheet" href="css/mock.css">
    </head>
    <body>
      <div class="app">
        <header class="top">
          <div class="topline">
            <a class="back" href="family.html">‹</a>
              <h1>家族タスク</h1>
              </div>
              <div class="sub">わが家の記録帳 ・ 家族の共有スペース</div>
              </header>
              <main class="content">
                <section class="card">
                  <div class="cardhead">
                    <div>
                      <h2>家族タスク</h2>
                        <div class="muted">期限切れと今日から7日以内のタスク</div>
                        </div>
                        <span class="count" id="taskCount">5件</span>
                        </div>
                        <div class="filters">
                          <button class="filter active" data-filter="all">すべて</button>
                            <button class="filter" data-filter="overdue">期限切れ</button>
                              <button class="filter" data-filter="week">1週間以内</button>
                              </div>
                              <form id="addForm" class="formrow">
                                <input id="taskName" class="field" placeholder="タスク名" required>
                                <input id="taskDate" class="field" type="date" required style="max-width:145px">
                                <button class="btn">追加</button>
                                </form>
                                <div id="items">
                                </div>
                              </section>
                            </main>
                            <nav class="bottom">
                              <a href="home.html">
                                <span>⌂</span>ホーム</a>
                                  <a href="calendar.html">
                                    <span>▦</span>カレンダー</a>
                                      <a class="active" href="family.html">
                                        <span>♧</span>家族</a>
                                          <a href="pet.html">
                                            <span>🐾</span>ペット</a>
                                            </nav>
                                          </div>
                                          <div id="toast" class="toast">
                                          </div>
                                          <script src="js/mock.js">
                                          </script>
                                          <script src="js/tasks.js">
                                          </script>
                                        </body>
                                      </html>
