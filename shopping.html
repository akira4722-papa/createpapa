<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#13866e">
    <title>買い物リスト | わが家の記録帳</title>
      <link rel="stylesheet" href="css/mock.css">
    </head>
    <body>
      <div class="app">
        <header class="top">
          <div class="topline">
            <a class="back" href="family.html">‹</a>
              <h1>買い物リスト</h1>
              </div>
              <div class="sub">わが家の記録帳 ・ 家族の共有スペース</div>
              </header>
              <main class="content">
                <section class="card">
                  <div class="cardhead">
                    <div>
                      <h2>買い物リスト</h2>
                        <div class="muted">チェックするとリストから自動で削除されます</div>
                        </div>
                        <span class="count" id="shoppingCount">5件</span>
                        </div>
                        <form id="addForm" class="formrow">
                          <input id="newItem" class="field" placeholder="買うものを追加" required>
                          <button class="btn">追加</button>
                          </form>
                          <div id="items">
                          </div>
                        </section>
                        <p class="hint">チェックした品目はこのモック上の一覧から削除されます。</p>
                        </main>
                        <nav class="bottom">
                          <a href="home.html">
                            <span>⌂</span>ホーム</a>
                              <a href="calendar.html">
                                <span>▦</span>カレンダー</a>
                                  <a class="active" href="family.html">
                                    <span>♧</span>家族</a>
                                      <a href="pet.html">
                                        <span>🐾</span>ペット</a>
                                        </nav>
                                      </div>
                                      <div id="toast" class="toast">
                                      </div>
                                      <script src="js/mock.js">
                                      </script>
                                      <script src="js/shopping.js">
                                      </script>
                                    </body>
                                  </html>
