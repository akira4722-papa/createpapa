                                                        <section class="card">

                                                              <div class="headleft">
                                                                <div class="ico purple">💬</div>
                                                                  <div>
                                                                    <h2>家族掲示板</h2>

                                                                    </div>
                                                                  </a>

                                                                  <a class="link" href="packing.html">
