<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#f5f5f3"><title>ごみ収集日 | わが家の記録帳</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/family-pages.css"></head><body>
<aside class="sidebar"><div class="logo">🏠 わが家の記録帳<small>Family Dashboard</small></div><button class="nav-item" onclick="location.href='home.html'">🏠 ホーム</button><button class="nav-item" onclick="location.href='calendar.html'">📅 カレンダー</button><button class="nav-item" onclick="location.href='family.html'">👨‍👩‍👧‍👧 家族</button><button class="nav-item" onclick="location.href='pet.html'">🐈 ペット</button><button class="nav-item">☰ その他</button></aside><main class="main"><header class="header"><div><div class="date" id="todayDate"></div><div class="header-title">ごみ収集日</div></div><div class="family-header-chip"><span>👨‍👩‍👧‍👧</span><span>家族の共有スペース</span></div></header><main class="family-content">
<section class="family-page-heading"><a class="family-back" href="family.html">‹ 家族に戻る</a><h1>ごみ収集日</h1><p>日付を選択して収集区分を登録。複数日の一括登録にも対応。</p></section>
<section class="family-panel"><div class="family-panel-heading"><div><h2>収集カレンダー</h2><p>日付をタップすると登録済みの予定を確認できます。</p></div></div><div class="family-calendar-toolbar"><button class="family-button secondary" id="prev" type="button">‹ 前月</button><strong id="month"></strong><button class="family-button secondary" id="next" type="button">翌月 ›</button></div><div class="family-weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="family-daygrid"></div><div class="family-selected-panel"><h3 id="selectedTitle">選択した日の収集予定</h3><div id="selectedTypes" class="family-tags"><span class="family-muted">日付を選択してください</span></div></div></section>
<section class="family-panel"><div class="family-panel-heading"><div><h2>収集日を登録</h2><p>カレンダーで日付を選んで登録します。</p></div></div><label class="family-bulk-toggle"><input id="bulkMode" type="checkbox"><span>まとめて追加</span></label><div id="bulkSelection" class="family-bulk-selection" hidden><p>カレンダーの日付をタップして複数選択してください。</p><div id="selectedDates" aria-live="polite">日付を選択してください</div></div><form id="addForm" class="family-form"><select id="type" class="family-input" aria-label="収集区分"></select><button class="family-button" id="applyButton" type="submit">選択した日に登録</button></form></section></main></main>
<nav class="mobile-nav"><button class="mobile-nav-item" onclick="location.href='home.html'"><span>🏠</span>ホーム</button><button class="mobile-nav-item" onclick="location.href='calendar.html'"><span>📅</span>予定</button><button class="mobile-nav-item active" onclick="location.href='family.html'"><span>👨‍👩‍👧‍👧</span>家族</button><button class="mobile-nav-item" onclick="location.href='pet.html'"><span>🐈</span>ペット</button><button class="mobile-nav-item"><span>☰</span>その他</button></nav><div id="toast" class="family-toast" role="status" aria-live="polite"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/family-db.js"></script><script src="js/family-garbage.js"></script><script>document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());</script></body></html>
