<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="わが家の記録帳">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="./home.png">
  <link rel="manifest" href="./manifest.json">
  <title>わが家の記録帳</title>
  <style>
    :root { color-scheme: light; background: #f5f5f3; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f5f3;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #f5f5f3;
    }
  </style>
</head>
<body>
  <!-- ホーム画面WebアプリのURLをindex.htmlに固定し、既存ページをiframe内で表示します。 -->
  <iframe
    id="appFrame"
    src="./home.html"
    title="わが家の記録帳"
    allow="clipboard-read; clipboard-write"
    loading="eager"
  ></iframe>
  <noscript>このサイトを利用するにはJavaScriptを有効にしてください。</noscript>
</body>
</html>
