<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f3">
<title>カレンダー | わが家の記録帳</title>
<link rel="stylesheet" href="css/style.css">
<link rel="apple-touch-icon" href="./home.png">
</head>
<body>
<!-- =======================================================
     PC サイドバー
======================================================= -->

<aside class="sidebar">

    <div class="logo">
        🏠 わが家の記録帳
        <small>Family Dashboard</small>
    </div>


    <button
        class="nav-item"
        data-page="home">

        🏠
        ホーム

    </button>


    <button
        class="nav-item active"
        data-page="calendar">

        📅
        カレンダー

    </button>


    <button class="nav-item">
        👧
        子どもたちの記録
    </button>


    <button class="nav-item">
        🏡
        家の管理
    </button>


    <button class="nav-item">
        💰
        家計・支出
    </button>


    <button class="nav-item">
        🚗
        旅行・おでかけ
    </button>


    <button class="nav-item">
        🌱
        庭・芝生
    </button>


    <button class="nav-item" type="button" onclick="window.location.href='pet.html'">
        🐈
        ペット
    </button>


    <button class="nav-item">
        📷
        写真・思い出
    </button>


    <button class="nav-item">
        📝
        メモ・Todo
    </button>


    <button class="nav-item">
        ⚙️
        設定
    </button>

</aside>




<main class="main">
<!-- =====================================================
     共通ヘッダー
===================================================== -->

<header class="header">

    <div>

        <div
            class="date"
            id="todayDate">
        </div>

        <div
            class="header-title"
            id="headerTitle">

            おかえりなさい

        </div>

    </div>


    <div class="weather">

        <div class="weather-icon">
            ☀️
        </div>

        <div>

            <div class="weather-temp">
                22℃
            </div>

            <div
                style="
                font-size:10px;
                color:#999;
                ">

                土浦周辺

            </div>

        </div>

    </div>

</header>




<!-- =====================================================
     CALENDAR
===================================================== -->

<section
    id="calendarPage"
    class="page active">


    <!-- タイトル -->

    <div class="calendar-page-header">

        <div>

            <div class="calendar-page-title">
                📅 カレンダー
            </div>

            <div class="calendar-page-subtitle">
                家族の予定をまとめて確認できます。
            </div>

        </div>


        <button
            class="primary-button"
            onclick="openEventModal()">

            ＋ 予定を追加

        </button>

    </div>



    <!-- 操作 -->

    <div class="calendar-toolbar">


        <div class="view-switch">

            <button
                class="active"
                onclick="changeCalendarView('month', this)">

                月

            </button>

            <button
                onclick="changeCalendarView('week', this)">

                週

            </button>

            <button
                onclick="changeCalendarView('day', this)">

                日

            </button>

        </div>



        <div class="month-navigation">

            <button onclick="changeMonth(-1)">
                ‹
            </button>

            <div
                class="current-month"
                id="currentMonth">

            </div>

            <button onclick="changeMonth(1)">
                ›
            </button>

            <button
                class="today-button"
                onclick="goToday()">

                今日

            </button>

        </div>


    </div>



    <!-- カレンダー＋右側 -->

    <div class="calendar-layout">


        <div>


            <div class="calendar-card">

                <div class="calendar-scroll">

                    <div
                        class="calendar-grid"
                        id="calendarGrid">

                    </div>

                </div>

            </div>



            <!-- 選択日の予定 -->

            <div class="selected-day-card">

                <div
                    class="selected-day-title"
                    id="selectedDayTitle">

                </div>

                <div
                    id="selectedDayEvents">

                </div>

            </div>



            <!-- 今月のイベント -->

            <div class="month-events"
                 id="monthEvents">

            </div>


        </div>



        <!-- 今後の予定 -->

        <aside class="upcoming-card">

            <div class="upcoming-title">

                今後の予定

                <button
                    class="upcoming-link"
                    onclick="openEventModal()">

                    ＋追加

                </button>

            </div>


            <div id="upcomingEvents">

            </div>

        </aside>


    </div>


</section>



</main>
<!-- =======================================================
     スマホ下部ナビ
======================================================= -->

<nav class="mobile-nav">


    <button
        class="mobile-nav-item"
        data-page="home">

        <span>🏠</span>
        ホーム

    </button>


    <button
        class="mobile-nav-item active"
        data-page="calendar">

        <span>📅</span>
        予定

    </button>


    <button class="mobile-nav-item">

        <span>👨‍👩‍👧‍👧</span>
        家族

    </button>


    <button class="mobile-nav-item" type="button" onclick="window.location.href='pet.html'">

        <span>🐈</span>
        ペット

    </button>


    


    <button class="mobile-nav-item">

        <span>☰</span>
        その他

    </button>


</nav>




<!-- =======================================================
     Supabaseログインモーダル
======================================================= -->

<div
    class="modal-overlay show"
    id="authModal">

    <div class="modal">

        <div class="modal-title">
            わが家の記録帳にログイン
        </div>

        <div
            style="margin-bottom:18px;color:#777;font-size:13px;line-height:1.7;">
            Supabaseに保存した家族の予定を表示します。
        </div>

        <div class="form-group">
            <label>メールアドレス</label>
            <input
                type="email"
                id="loginEmail"
                autocomplete="email"
                placeholder="family@example.com">
        </div>

        <div class="form-group">
            <label>パスワード</label>
            <input
                type="password"
                id="loginPassword"
                autocomplete="current-password"
                placeholder="パスワード">
        </div>

        <div
            id="loginError"
            style="display:none;margin-top:8px;color:#d9534f;font-size:12px;line-height:1.6;">
        </div>

        <div class="modal-buttons">
            <button
                class="save-button"
                id="loginButton"
                onclick="loginToSupabase()">
                ログイン
            </button>
        </div>

    </div>

</div>



<!-- =======================================================
     ＋ボタン
======================================================= -->

<button
    class="floating-button"
    onclick="openEventModal()">

    ＋

</button>



<!-- 予定入力モーダル -->
<div class="modal-overlay" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
  <div class="modal event-entry-modal">
    <div class="modal-title" id="eventModalTitle">予定を追加</div>
    <div class="field-hint" id="eventEntryHelp">編集内容は保存するとカレンダーに反映されます。</div>

    <div class="form-group entry-calendar-section">
      <div class="entry-calendar-heading">
        <label>カレンダー</label>
        <label class="check-control"><input type="checkbox" id="bulkModeToggle" onchange="toggleBulkMode()"> まとめて入力</label>
      </div>
      <div class="entry-calendar-nav">
        <button type="button" class="entry-month-button" onclick="changeEntryMonth(-1)" aria-label="前の月">‹</button>
        <strong id="entryMonthLabel"></strong>
        <button type="button" class="entry-month-button" onclick="changeEntryMonth(1)" aria-label="次の月">›</button>
      </div>
      <div class="entry-calendar-grid" id="entryCalendarGrid" aria-label="予定の日付を選択"></div>
      <div class="entry-calendar-help" id="entryCalendarHelp">予定を登録する日を選んでください。</div>
      <input type="hidden" id="eventDate">
    </div>

    <div class="form-group" id="startTimeGroup">
      <label for="eventTime">開始時刻</label>
      <input type="time" id="eventTime" value="10:00">
    </div>
    <div class="form-group" id="endTimeGroup">
      <label for="eventEndTime">終了時刻</label>
      <input type="time" id="eventEndTime" value="11:00">
    </div>
    <div class="form-group all-day-row">
      <label class="check-control"><input type="checkbox" id="eventAllDay" onchange="toggleAllDay()"> 終日</label>
      <span class="field-hint">オンにすると時刻の入力は不要です。</span>
    </div>
    <div class="form-group">
      <label for="eventTitle">予定名</label>
      <input type="text" id="eventTitle" placeholder="例：保育園イベント" maxlength="120">
    </div>
    <div class="form-group">
      <label for="eventCategory">カテゴリ</label>
      <select id="eventCategory" disabled><option value="">カテゴリを読み込み中...</option></select>
    </div>
    <div class="form-group">
      <label for="eventRecurrence">繰り返し</label>
      <select id="eventRecurrence">
        <option value="none">繰り返さない</option>
        <option value="weekly">毎週</option>
        <option value="monthly">毎月</option>
        <option value="yearly">毎年</option>
      </select>
      <div class="field-hint">誕生日や記念日は「毎年」を選択。繰り返し予定は終了日を指定せず登録されます。</div>
    </div>
    <div class="modal-buttons">
      <button class="cancel-button" type="button" onclick="closeEventModal()">キャンセル</button>
      <button class="save-button" type="button" onclick="saveEvent()">保存</button>
    </div>
  </div>
</div>

<!-- =======================================================
     予定詳細モーダル
======================================================= -->
<div class="modal-overlay" id="eventDetailModal" role="dialog" aria-modal="true" aria-labelledby="eventDetailTitle">
    <div class="modal">
        <div class="modal-title" id="eventDetailTitle">予定の詳細</div>

        <div class="form-group">
            <div class="detail-label">予定</div>
            <div class="detail-value" id="detailEventTitle"></div>
        </div>
        <div class="form-group">
            <div class="detail-label">日付</div>
            <div class="detail-value" id="detailEventDate"></div>
        </div>
        <div class="form-group">
            <div class="detail-label">時刻</div>
            <div class="detail-value" id="detailEventTime"></div>
        </div>
        <div class="form-group">
            <div class="detail-label">カテゴリ</div>
            <div class="detail-value" id="detailEventCategory"></div>
        </div>

        <div class="modal-buttons">
            <button class="save-button" id="editEventButton" type="button" onclick="editSelectedEvent()">編集</button>
            <button class="delete-button" id="deleteEventButton" type="button" onclick="deleteSelectedEvent()">削除</button>
            <button class="cancel-button" type="button" onclick="closeEventDetailModal()">閉じる</button>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
</body>
</html>
